version: "3.9"

services:
  # PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: sanna_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanna_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-sanna_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanna} -d ${POSTGRES_DB:-sanna_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sanna_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanna_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sanna}:${POSTGRES_PASSWORD:-sanna_dev_2024}@db:5432/${POSTGRES_DB:-sanna_crm}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-sanna}:${POSTGRES_PASSWORD:-sanna_dev_2024}@db:5432/${POSTGRES_DB:-sanna_crm}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:80}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - sanna_network

  # React + Vite Frontend (dev mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sanna_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - sanna_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sanna_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sanna_network

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local

networks:
  sanna_network:
    driver: bridge
